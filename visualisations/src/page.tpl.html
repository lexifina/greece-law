<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Το ελληνικό δίκαιο σε 20 γραφήματα</title>
<meta name="description" content="Είκοσι γραφήματα για το ελληνικό δίκαιο από τα δεδομένα του αποθετηρίου greece-law / Twenty charts on Greek law from the greece-law repository">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  color-scheme: light;
  --bg: #f7f6f3; --surface: #fcfcfb; --surface-2: #f1f0ec; --line: #e4e2dc; --grid: #ebe9e4;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974; --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --muted-mark: #b9b7b0;
  --seq-lo: #eef4fc; --seq-hi: #0d366b;
  --sans: "Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Noto Serif", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --muted-mark: #55544f;
    --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --muted-mark: #55544f;
  --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 8px; }
.bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.toggles { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--text-2); font: 500 13px/1 var(--sans); padding: 7px 12px; border-radius: 999px; cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1 { font: 600 clamp(28px, 5vw, 44px)/1.2 var(--serif); margin: 0 0 14px; letter-spacing: -.01em; }
.lede { font-size: 17px; color: var(--text-2); max-width: 780px; margin: 0 0 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 26px 0 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; }
.tile b { display: block; font: 600 24px/1.15 var(--sans); }
.tile span { font-size: 12px; color: var(--text-2); line-height: 1.5; display: block; margin-top: 2px; }
details.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0 0; }
details.profile > summary, details.tbl > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; font-size: 14px; list-style: none; }
details.profile > summary::-webkit-details-marker, details.tbl > summary::-webkit-details-marker { display: none; }
details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }
details[open].profile > summary::before, details[open].tbl > summary::before { transform: rotate(90deg); }
.scroll { overflow-x: auto; padding: 0 14px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--text-2); font-size: 12px; }
td.n, th.n { text-align: right; white-space: nowrap; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
nav.toc { margin: 30px 0 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 22px; font-size: 13px; }
nav.toc a { color: var(--text-2); text-decoration: none; display: block; padding: 3px 0; line-height: 1.5; }
nav.toc a:hover { color: var(--text); text-decoration: underline; }
nav.toc .p { font-weight: 600; color: var(--text); margin-top: 6px; }
section.part { padding-top: 34px; }
section.part > h2 { font: 600 26px/1.3 var(--serif); margin: 0 0 6px; }
section.part > p.pd { color: var(--text-2); margin: 0 0 6px; max-width: 780px; }
figure.chart { margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 6px; }
figure.chart h3 { font: 600 19px/1.45 var(--serif); margin: 0 0 6px; }
figure.chart h3 .no { color: var(--text-3); font-weight: 500; margin-right: .35em; }
.dek { color: var(--text-2); margin: 0 0 12px; max-width: 840px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 0 0 8px; line-height: 1.5; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
.legend i.ring { background: transparent !important; border: 2px solid var(--text-3); border-radius: 50%; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.legend i.dash { height: 0; width: 14px; border-radius: 0; border-top: 2px dashed; background: transparent !important; vertical-align: 3px; }
.legend i.hatch { background-image: repeating-linear-gradient(135deg, var(--muted-mark) 0 2px, transparent 2px 5px) !important; background-color: var(--surface-2) !important; }
.legend i.outline { background: transparent !important; border: 2px solid var(--text); border-radius: 3px; }
.legend i.band { height: 8px; width: 14px; border-radius: 2px; opacity: .35; vertical-align: 0; }
.legend i.tri { clip-path: polygon(0 0, 100% 0, 0 100%); border-radius: 0; }
.legend i.box { box-shadow: inset 0 0 0 1px var(--line); }
.legend i.strike { opacity: .6; background-image: linear-gradient(135deg, transparent 40%, var(--surface) 40%, var(--surface) 60%, transparent 60%) !important; }
.plot { width: 100%; position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .lbl { fill: var(--text-2); font: 11px var(--sans); font-variant-numeric: tabular-nums; }
.lbl.strong { fill: var(--text); font-weight: 500; }
.lbl.mut { fill: var(--text-3); }
.axis path { display: none; }
.axis line, .grid line { stroke: var(--grid); }
.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.6; }
.note b { color: var(--text-2); font-weight: 500; }
details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }
details.tbl > summary { font-size: 12px; color: var(--text-2); padding: 10px 18px; }
details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.5; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.tip .q { margin-top: 4px; color: var(--text-2); }
.hit { fill: transparent; cursor: default; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.mini h4 { margin: 0 0 2px; font: 600 13px/1.4 var(--sans); }
.mini p { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
.multi h4 { margin: 0; font: 600 13px/1.4 var(--sans); overflow-wrap: anywhere; }
.multi p { margin: 0 0 2px; font-size: 12px; color: var(--text-2); }
.multi > div { display: flex; flex-direction: column; min-width: 0; }
.multi > div > .plot { margin-top: auto; }
.ptiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.ptile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ptile .pn { font: 500 12px/1.4 var(--sans); color: var(--text-2); overflow-wrap: anywhere; }
.ptile .pv { font-size: 12px; color: var(--text-2); margin: 2px 0; }
.ptile .pv b { font: 600 22px/1.15 var(--sans); color: var(--text); margin-right: 2px; }
.ptile .ps { font-size: 12px; color: var(--text-3); line-height: 1.5; }
.ptile .pbar { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; }
.ptile .pbar i { display: block; }
.ptile svg { display: block; width: 100%; height: auto; margin-top: 6px; }
.sub { margin: 18px 0 4px; font: 600 13px/1.4 var(--sans); }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; line-height: 1.6; }
@media (max-width: 560px) {
  figure.chart { padding: 14px 12px 4px; border-radius: 12px; }
  details.tbl { margin: 10px -12px 0; }
  details.tbl > summary { padding: 10px 12px; }
  details.tbl .scroll { padding: 0 12px 12px; }
  .lede { font-size: 15px; }
  .multi { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
  .ptiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (forced-colors: active) { .seg button[aria-pressed="true"] { outline: 2px solid CanvasText; } }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="bar">
    <span class="toggles">
      <span class="seg" role="group" aria-label="Γλώσσα / Language"><button data-lang="el">ΕΛ</button><button data-lang="en">EN</button></span>
      <span class="seg" role="group" aria-label="Θέμα / Theme"><button data-theme-set="auto">Auto</button><button data-theme-set="light">☀</button><button data-theme-set="dark">☾</button></span>
    </span>
  </div>
  <h1 data-i="title"></h1>
  <p class="lede" data-i="lede"></p>
  <p class="note" id="gl-link"></p>
  <div class="tiles" id="tiles"></div>
  <details class="profile"><summary data-i="profile_h"></summary><div class="scroll" id="profile"></div></details>
  <nav class="toc" id="toc"></nav>
</header>
<main id="main"></main>
<footer id="foot"></footer>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<script>
const DATA = /*DATA*/null;
</script>
<script>
"use strict";
const D = DATA.charts, PF = DATA.profile;
const LANGS = ['el', 'en'];
let LANG = 'el';
try { const q = new URLSearchParams(location.search).get('lang'); if (LANGS.includes(q)) LANG = q; else { const s = localStorage.getItem('gr-viz-lang'); if (LANGS.includes(s)) LANG = s; } } catch (e) {}
let THEME = 'auto';
try { const tt = localStorage.getItem('gr-viz-theme'); if (tt === 'light' || tt === 'dark') THEME = tt; } catch (e) {}

// ------------------------------------------------------------------ strings
const GL = '<a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>';
const S = {
el: {
  title: 'Το ελληνικό δίκαιο σε 20 γραφήματα',
  lede: 'Είκοσι γραφήματα σχεδιασμένα μόνο από τα δεδομένα αυτού του αποθετηρίου: το Σύνταγμα σε κάθε του έκδοση από το 2001, οι νόμοι και τα προεδρικά διατάγματα του ΦΕΚ που περιέχει, οι κανονιστικές πράξεις, οι εγκύκλιοι και οι γνωμοδοτήσεις που ανάρτησαν στη Διαύγεια δήμοι, περιφέρειες, υπουργεία και άλλοι φορείς, και οι αποφάσεις του Αρείου Πάγου.',
  profile_h: 'Τα δεδομένα: τι χρησιμοποιήθηκε και πόσο πλήρες είναι',
  tbl: 'Πίνακας δεδομένων', src: 'Πηγή στο αποθετήριο', n: 'Εγγραφές', cover: 'Κάλυψη', caveat: 'Όρια',
  ds: 'Δεδομένα', foot: 'Από το αποθετήριο lexifina/greece-law ({built}). Τους αριθμούς υπολογίζει το visualisations/src/prep.py από την ιστορία του git, τα κείμενα και τους πίνακες του αποθετηρίου· τη σελίδα συνθέτει το build.py. Τα γραφήματα περιγράφουν ό,τι καταγράφουν οι πηγές, όχι τις αιτίες του.',
  year: 'Έτος', total: 'Σύνολο', share: 'Ποσοστό', count: 'Αριθμός', partial: 'ημιτελές έτος',
  gl: 'Γραφήματα για το δίκαιο όλων των χωρών, από ολόκληρο το global-law: ' + GL + '. Εδώ, μόνο τα γραφήματα για την Ελλάδα.',
},
en: {
  title: 'Greek law in 20 charts',
  lede: 'Twenty charts drawn only from the data in this repository: the Constitution in every version since 2001, the laws and presidential decrees of the Government Gazette it holds, the regulatory acts, circulars and opinions that municipalities, regions, ministries and other bodies posted on Diavgeia, and the decisions of the Areios Pagos.',
  profile_h: 'The data: what was used and how complete it is',
  tbl: 'Data table', src: 'Source in the repository', n: 'Records', cover: 'Coverage', caveat: 'Limit',
  ds: 'Dataset', foot: 'Built from the lexifina/greece-law repository ({built}). The numbers are computed by visualisations/src/prep.py from the git history, the texts and the tables of the repository; build.py assembles the page. The charts describe what the sources record, not why.',
  year: 'Year', total: 'Total', share: 'Share', count: 'Count', partial: 'partial year',
  gl: 'Charts on every country’s law, from the whole of global-law: ' + GL + '. These are the charts on Greece alone.',
}};
const t = k => S[LANG][k];
const L = (el, en) => LANG === 'el' ? el : en;
const LA = a => Array.isArray(a) ? L(a[0], a[1]) : a;
const NB = ' ';
const grp = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, LANG === 'el' ? '.' : ',');
const dec = (v, d = 1) => { const s = Math.abs(+v).toFixed(d); const [a, b] = s.split('.'); return (+v < 0 && +s !== 0 ? '−' : '') + grp(a) + (b ? (LANG === 'el' ? ',' : '.') + b : ''); };
const fmt = n => (n == null ? '–' : Number.isInteger(+n) ? (+n < 0 ? '−' : '') + grp(String(Math.abs(Math.round(+n)))) : dec(+n, 1));
const pv = (v, d = 0) => dec(v, d) + (LANG === 'el' ? NB + '%' : '%');
const pct = (a, b, d = 0) => b ? pv(100 * a / b, d) : '–';
const MGEN = ['Ιανουαρίου', 'Φεβρουαρίου', 'Μαρτίου', 'Απριλίου', 'Μαΐου', 'Ιουνίου', 'Ιουλίου', 'Αυγούστου', 'Σεπτεμβρίου', 'Οκτωβρίου', 'Νοεμβρίου', 'Δεκεμβρίου'];
const MNOM = ['Ιανουάριος', 'Φεβρουάριος', 'Μάρτιος', 'Απρίλιος', 'Μάιος', 'Ιούνιος', 'Ιούλιος', 'Αύγουστος', 'Σεπτέμβριος', 'Οκτώβριος', 'Νοέμβριος', 'Δεκέμβριος'];
const MEN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON = { el: ['Ιαν', 'Φεβ', 'Μάρ', 'Απρ', 'Μάι', 'Ιούν', 'Ιούλ', 'Αύγ', 'Σεπ', 'Οκτ', 'Νοέ', 'Δεκ'], en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] };
const DOW = { el: ['Δευτέρα', 'Τρίτη', 'Τετάρτη', 'Πέμπτη', 'Παρασκευή', 'Σάββατο', 'Κυριακή'], en: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'] };
const DOW1 = { el: ['Δευ', 'Τρί', 'Τετ', 'Πέμ', 'Παρ', 'Σάβ', 'Κυρ'], en: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'] };
const dateTxt = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'el' ? `${d} ${MGEN[m - 1]} ${y}` : `${d} ${MEN[m - 1]} ${y}`; };
const dateShort = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'el' ? `${d} ${MON.el[m - 1]} ${y}` : `${d} ${MON.en[m - 1]} ${y}`; };
const monthTxt = s => { const [y, m] = s.split('-').map(Number); return LANG === 'el' ? `${MNOM[m - 1]} ${y}` : `${MEN[m - 1]} ${y}`; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S8 = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => css('--s' + i));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f) => a.reduce((s, d) => s + (f ? f(d) : d), 0);
const PD = s => d3.timeParse('%Y-%m-%d')(s);
const Cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const nn = (n, el, en) => LANG === 'el' ? `${fmt(n)} ${n === 1 ? el[0] : el[1]}` : `${fmt(n)} ${n === 1 ? en[0] : en[1]}`;
const andList = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + L(' και ', ' and ') + a[a.length - 1];
const median = a => { const s = [...a].sort((x, y) => x - y), n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : null; };
const yrs = (a, b) => a === b ? String(a) : `${a}–${b}`;

// ------------------------------------------------------------------ tooltip
const tip = document.getElementById('tip');
function showTip(ev, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(ev); }
function moveTip(ev) {
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.opacity = 0; }
function bindTip(sel, fn) {
  sel.on('mouseenter', (ev, d) => showTip(ev, fn(d))).on('mousemove', moveTip).on('mouseleave', hideTip)
     .on('touchstart', (ev, d) => { const tt = ev.touches[0]; showTip({ clientX: tt.clientX, clientY: tt.clientY }, fn(d)); }, { passive: true });
}
const trow = (sw, k, v) => `<div class="r"><span>${sw ? `<i class="sw" style="background:${sw}"></i>` : ''}${esc(k)}</span><span>${v}</span></div>`;

// ------------------------------------------------------------------ chart scaffolding
function legend(el, items) {
  const lg = el.append('div').attr('class', 'legend');
  items.forEach(it => { const s = lg.append('span'); s.append('i').attr('class', it.shape || '').style('background', it.c).style('border-color', it.c); s.append('span').text(it.l); });
  return lg;
}
function svgIn(el, w, h) { return el.append('div').attr('class', 'plot').append('svg').attr('viewBox', `0 0 ${w} ${h}`).attr('width', w).attr('height', h).attr('role', 'img'); }
function table(el, head, rows) {
  const d = el.append('details').attr('class', 'tbl');
  d.append('summary').text(t('tbl'));
  const tb = d.append('div').attr('class', 'scroll').append('table');
  tb.append('thead').append('tr').selectAll('th').data(head).join('th').attr('class', (h, i) => i ? 'n' : null).text(h => h);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').attr('class', (v, i) => i ? 'n' : null).text(v => typeof v === 'number' ? fmt(v) : v);
  return d;
}

chart('c02', el => {

      const w = W(el), nw = narrow(w), lab = r => `${r.id} · ${artName(r.id)}`;
      const groups = [[L('Αναθεώρηση του 2008 (Ψήφισμα της 27ης Μαΐου 2008)', 'The 2008 revision (resolution of 27 May 2008)'), a08], [L('Αναθεώρηση του 2019 (Ψήφισμα της 25ης Νοεμβρίου 2019)', 'The 2019 revision (resolution of 25 November 2019)'), a19]];
      const all = a08.concat(a19), M = d3.max(all, r => Math.max(r.ins, r.del));

      const pw = w - lw, x = d3.scaleLinear().domain([-M, M]).range([vr, pw - vr]), x0 = x(0);

        y += headH;
        rows.forEach(r => {

          if (r.del) g.append('path').attr('d', barPathL(x(-r.del), by, x0 - 1, bh, 3)).attr('fill', cout).attr('opacity', r.repealed ? .65 : 1);
          if (r.ins) g.append('path').attr('d', barPath(x0 + 1, by, x(r.ins), bh, 3)).attr('fill', cin);

          if (r.ins) g.append('text').attr('class', 'lbl').attr('x', x(r.ins) + 5).attr('y', by + 10).text('+' + fmt(r.ins));
          bindTip(g.append('rect').attr('class', 'hit').attr('x', -lw).attr('width', w).attr('y', y).attr('height', rowH).datum(r),
            d => `<b>${L('Άρθρο', 'Article')} ${d.id}</b><div class="q">${esc(artName(d.id))}</div>` + trow(cin, L('Λέξεις που μπήκαν', 'Words added'), fmt(d.ins)) + trow(cout, L('Λέξεις που βγήκαν', 'Words removed'), fmt(d.del)) +
              trow(null, L('Λέξεις πριν → μετά', 'Words before → after'), `${fmt(d.before)} → ${fmt(d.after)}`) + (d.repealed ? trow(null, '', L('καταργήθηκε', 'repealed')) : ''));

      [-200, -100, 0, 100, 200].filter(v => Math.abs(v) <= M).forEach(v => g.append('text').attr('class', 'lbl mut').attr('x', x(v)).attr('y', y + 16).attr('text-anchor', 'middle').text(v ? (v > 0 ? '+' : '−') + fmt(Math.abs(v)) : '0'));
      note(el, ['syntagma/art-<ΑΡΙΘΜΟΣ>.md', 'git log -- syntagma'], L(`${a08.length + a19.length} αλλαγές άρθρων`, `${a08.length + a19.length} changes to articles`),
        L(`οι λέξεις μετρώνται με σύγκριση του κειμένου πριν και μετά κάθε αναθεώρηση (λέξη προς λέξη)· μια λέξη που αντικαταστάθηκε μετρά μία φορά ως αφαίρεση και μία ως προσθήκη. Οι αλλαγές των επανεκδόσεων (${fmt(sum(Object.values(R.typo_words)))} λέξεις σε ${fmt(sum(Object.values(R.typo)))} άρθρα) δεν περιλαμβάνονται.`,

part('p2', 'II. Νόμοι και προεδρικά διατάγματα', 'II. Laws and presidential decrees',
  'Οι νόμοι και τα προεδρικά διατάγματα του ΦΕΚ, τεύχος Α΄, που περιέχει το αποθετήριο (nomos/, diatagma/). Είναι επιλογή και όχι το σύνολο: τα γραφήματα μιλούν για τις πράξεις που περιέχει.',

chart('c04', el => {

  const t0y = c.rows.map(r => +r.t0.slice(0, 4)).sort((a, b) => a - b), q = t0y[Math.floor(t0y.length * 0.05)], nq = sum(t0y, v => (v >= q ? 1 : 0)), yMax = t0y[t0y.length - 1];
  return {

      `The repository follows ${fmt(c.n)} laws through every later amendment (${fmt(nq)} of them took effect in ${q}–${yMax}). The first chart shows how many remained unamended as months passed from their entry into force: ${pv(100 * s12)} after one year, ${pv(100 * s24)} after two, ${pv(100 * s36)} after three. The second, in which article of the amending law the amendment sat; ${fmt(deep)} of ${fmt(known)} came after article 50, and ${fmt(amOmni)} of the ${fmt(c.amenders)} amending laws have “and other provisions” in their title.`),

      const svg = svgIn(pa, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`), iw = w - m.l - m.r, ih = h - m.t - m.b;

      yAxis(g, y, iw, 4, v => pv(100 * v));
      [0, 12, 24, 36, 48].forEach(v => g.append('text').attr('class', 'lbl').attr('x', x(v)).attr('y', ih + 16).attr('text-anchor', 'middle').text(v ? L(`${v / 12} ${v === 12 ? 'έτος' : 'έτη'}`, `${v / 12} yr`) : '0'));

        k => `<b>${L(`${dec(k[0], 1)} μήνες`, `${dec(k[0], 1)} months`)}</b>` + trow(ink, L('Χωρίς τροποποίηση', 'Not yet amended'), pv(100 * k[1], 1)) + trow(null, L('Νόμοι σε παρακολούθηση μετά', 'Laws still followed after'), fmt(k[2])));

      const bl = c.bins.map(([lo, hi, n]) => ({ l: hi > 1000 ? L(`μετά το ${lo - 1}`, `after ${lo - 1}`) : L(`άρθρα ${lo}–${hi}`, `articles ${lo}–${hi}`), n }));
      bl.push({ l: L('χωρίς αριθμό άρθρου', 'no article number'), n: c.noart, mut: true });

      table(el, [L('Νόμος', 'Law'), L('Σε ισχύ από', 'In force from'), L('Πρώτη τροποποίηση', 'First amendment'), L('Από', 'By'), L('Τροποποιήσεις', 'Amendments')],

        c.am.slice().sort((a, b) => a.date.localeCompare(b.date)).map(a => [a.date, a.target, a.by, a.art || '–', a.omni ? L('ναι', 'yes') : '']), [0, 0, 0, 1, 0]);

});

        L(`η οδηγία και η ημερομηνία της διαβάζονται από τον τίτλο της ελληνικής πράξης (κανόνες στο src/prep.py), όχι από μια άλλη πράξη που ο τίτλος παραθέτει σε εισαγωγικά. Η προθεσμία ενσωμάτωσης κάθε οδηγίας δεν περιέχεται στο αποθετήριο, οπότε το διάστημα δεν δείχνει καθυστέρηση. ${D.c06.nodate.length} ακόμη πράξεις ονομάζουν οδηγία χωρίς ημερομηνία (στον πίνακα).`,

      subTable(el, L('Οδηγίες χωρίς ημερομηνία στον τίτλο', 'Directives without a date in the title'), [L('Πράξη', 'Act'), L('Οδηγία', 'Directive')], D.c06.nodate, [0, 0]);

const PDT = { amend: ['Τροποποίηση άλλου διατάγματος ή νόμου', 'Amending another decree or law'], org: ['Οργάνωση υπηρεσιών: ίδρυση, σύσταση, κατάργηση', 'Organising services: founding, setting up, abolishing'],

chart('c05', el => {

      const hx = w - lw - stripW, mxc = d3.max(rows, r => d3.max(Object.values(r[2])) || 0), col = d3.scaleSequentialSqrt(seqRamp()).domain([0, mxc]);
      if (!nw) YRS.forEach((yy, j) => { if (j % 2 === 0 || j === YRS.length - 1) g.append('text').attr('class', 'lbl mut').attr('x', hx + j * cw + cw / 2).attr('y', -8).attr('text-anchor', 'middle').text(`’${String(yy).slice(2)}`); });
      rows.forEach((r, i) => {

        else g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + 16).attr('text-anchor', 'end').text(labs[i]);
        g.append('path').attr('d', barPath(0, by, Math.max(2, x(r[1])), 13, 3)).attr('fill', fill);

        bindTip(g.append('rect').attr('class', 'hit').attr('x', -lw).attr('width', w).attr('y', cy).attr('height', rowH).datum(r),
          d => `<b>${esc(L(...PDT[d[0]]))}</b>` + trow(null, L('Διατάγματα', 'Decrees'), `${fmt(d[1])} · ${pct(d[1], N)}`) + YRS.filter(yy => d[2][yy]).map(yy => trow(null, yy, fmt(d[2][yy]))).join('') +

      table(el, [L('Θέμα', 'Subject'), ...YRS.map(String), t('total')], rows.map(r => [L(...PDT[r[0]]), ...YRS.map(yy => r[2][yy] || 0), r[1]]));

const fromTo = (a, b) => { const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number);
  return L(`από τον ${MACC[ma - 1]} του ${ya} ως τον ${MACC[mb - 1]} του ${yb}`, `from ${MEN[ma - 1]} ${ya} to ${MEN[mb - 1]} ${yb}`); };
const CATS = ['dimos', 'perif', 'apok', 'ypourg', 'univ', 'other'];
const CATN = { dimos: ['Δήμοι', 'Municipalities'], perif: ['Περιφέρειες', 'Regions'], apok: ['Αποκεντρωμένες διοικήσεις', 'Decentralised administrations'], ypourg: ['Υπουργεία', 'Ministries'],
  univ: ['Πανεπιστήμια και ΤΕΙ', 'Universities and TEIs'], other: ['Άλλοι φορείς', 'Other bodies'], all: ['Όλοι οι φορείς', 'All bodies'] };
const catCol = k => ({ dimos: css('--s1'), perif: css('--s3'), apok: css('--s4'), ypourg: css('--s7'), univ: css('--s5'), other: css('--muted-mark') }[k]);
const kfmt = v => v >= 10000 ? L(`${fmt(Math.round(v / 1000))} χιλ.`, `${fmt(Math.round(v / 1000))}k`) : fmt(v);
const dvPartial = y => y === PF.dv_from.slice(0, 4) || y === PF.dv_to.slice(0, 4);
const dvPartTxt = y => y === PF.dv_from.slice(0, 4) ? L(`από τον ${MACC[+PF.dv_from.slice(5) - 1]}`, `from ${MEN[+PF.dv_from.slice(5) - 1]}`) : L(`ως τον ${MACC[+PF.dv_to.slice(5) - 1]}`, `to ${MEN[+PF.dv_to.slice(5) - 1]}`);

// ================================================================== IV. the Areios Pagos

  'Γ': ['Γ΄ Πολιτικό', '3rd Civil'], 'Δ': ['Δ΄ Πολιτικό', '4th Civil'], 'Ε': ['Ε΄ Ποινικό', '5th Criminal'], 'ΣΤ': ['ΣΤ΄ Ποινικό', '6th Criminal'], 'Ζ': ['Ζ΄ Ποινικό', '7th Criminal'],

const OUTK = ['quash', 'dismiss', 'closed', 'other'];
const outCol = k => ({ quash: css('--s1'), dismiss: css('--s2'), closed: css('--s4'), other: css('--muted-mark') }[k]);

part('p4', 'IV. Ο Άρειος Πάγος', 'IV. The Areios Pagos',
  'Οι αποφάσεις του Αρείου Πάγου, που κρίνει τις αιτήσεις αναίρεσης κατά αποφάσεων των πολιτικών και ποινικών δικαστηρίων, όπως τις δημοσιεύει ο ιστότοπός του (caselaw/areios-pagos/): ο αριθμός, το τμήμα και η ημέρα δημοσίευσης κάθε απόφασης, και από το κείμενό της η ημέρα της συζήτησης, το διατακτικό και η απόφαση που προσβλήθηκε.',

chart('c14', el => {
  const R = D.c14.years, N = D.c14.n, mxc = R.reduce((a, b) => b.civil > a.civil ? b : a), mnc = R.reduce((a, b) => b.civil < a.civil ? b : a);

      `The decisions the Areios Pagos published each year, as its website holds them: ${fmt(civ)} of the civil sections, ${fmt(cri)} of the criminal sections and ${fmt(ple)} of the Plenary. The numbering shows how many are missing: the civil decisions of ${mnc.y} run to number ${fmt(mnc.hi_civil)}, so few are missing; of the criminal decisions of ${andList(gap.map(r => r.y))}, almost all are missing.`),
    draw(el) {
      const keys = ['civil', 'criminal', 'plenary', 'miss'], PH_ = '#010203', colors = [...keys.slice(0, 3).map(grpCol), PH_];

      legend(el, keys.map((k, i) => ({ c: i < 3 ? colors[i] : css('--surface-2'), l: names[i], shape: i < 3 ? '' : 'hatch' })));
      const rows = R.map(r => ({ ...r, y: String(r.y), miss: Math.max(0, r.hi_civil - r.civil) + Math.max(0, r.hi_criminal - r.criminal) }));
      const s = stackedColumns(el, rows, keys, colors, names, { h: 290, pad: 0.3, bw: 44, noShare: true, topLabel: r => kfmt(r.civil + r.criminal + r.plenary),
        tipExtra: r => trow(null, L('Πολιτικές: ως τον αριθμό', 'Civil: up to number'), fmt(r.hi_civil)) + trow(null, L('Ποινικές: ως τον αριθμό', 'Criminal: up to number'), fmt(r.hi_criminal)) +
          trow(null, L('Ποινικές που υπάρχουν', 'Criminal decisions held'), pct(r.criminal, r.hi_criminal)) });
      const hp = hatch(s.svg); s.g.selectAll('path').filter(function () { return this.getAttribute('fill') === PH_; }).attr('fill', hp);
      note(el, ['caselaw/areios-pagos/<ΕΤΟΣ>/<ΤΜΗΜΑ>/…/decision.html', 'git log (Kind: caselaw)'], L(`${fmt(N)} αποφάσεις`, `${fmt(N)} decisions`),
        L('το έτος είναι το έτος της απόφασης. Οι πολιτικές και οι ποινικές αριθμούνται χωριστά κάθε έτος, οπότε ο μεγαλύτερος αριθμός δείχνει περίπου πόσες εκδόθηκαν· όσες λείπουν ως εκείνον τον αριθμό σχεδιάζονται διαγραμμισμένες (στον πίνακα οι αριθμοί). Πάνω από κάθε στήλη, οι αποφάσεις που υπάρχουν. Τα τμήματα διακοπών μετρούν στα ποινικά.',

      table(el, [t('year'), ...names, t('total'), L('Πολιτικές ως τον αριθμό', 'Civil up to number'), L('Ποινικές ως τον αριθμό', 'Criminal up to number')], R.map(r => [String(r.y), r.civil, r.criminal, r.plenary, r.civil + r.criminal + r.plenary, r.hi_civil, r.hi_criminal]));

chart('c15', el => {
  const c = D.c15, G = new Map(c.grid.map(([y, m, n]) => [y + ':' + m, n])), Y = [...new Set(c.grid.map(x => x[0]))], N = c.n;

  const top3 = y => d3.range(1, 13).sort((a, b) => (G.get(y + ':' + b) || 0) - (G.get(y + ':' + a) || 0)).slice(0, 3);
  const inTop = sum(Y, y => (top3(y).includes(mxm + 1) ? 1 : 0)), lowest = sum(Y, y => (d3.range(1, 13).every(m => (G.get(y + ':' + (mnm + 1)) || 0) <= (G.get(y + ':' + m) || 0)) ? 1 : 0));
  return {
    title: L(`Το ημερολόγιο του Αρείου Πάγου: τον ${MACC[mxm]} δημοσιεύεται το ${pct(bym[mxm], N)} των αποφάσεων, τον ${MACC[mnm]} το ${pct(bym[mnm], N)}`, `The Areios Pagos calendar: ${pct(bym[mxm], N)} of decisions are published in ${MEN[mxm]}, ${pct(bym[mnm], N)} in ${MEN[mnm]}`),
    toc: L('Το ημερολόγιο του Αρείου Πάγου', 'The Areios Pagos calendar'),
    dek: L(`Κάθε κελί είναι ένας μήνας: όσο πιο σκούρο, τόσο περισσότερες αποφάσεις δημοσιεύθηκαν. Ο ${MNOM[mxm]} είναι ένας από τους τρεις μήνες με τις περισσότερες αποφάσεις σε ${inTop} από τα ${Y.length} έτη· ο ${MNOM[mnm]} είναι ο μήνας με τις λιγότερες σε ${lowest} από τα ${Y.length}. Δεξιά, οι αποφάσεις κάθε έτους.`,
      `Each cell is one month: the darker, the more decisions were published. ${MEN[mxm]} is one of the three months with the most decisions in ${inTop} of the ${Y.length} years; ${MEN[mnm]} is the month with the fewest in ${lowest} of the ${Y.length}. On the right, each year’s decisions.`),
    draw(el) {
      const w = W(el), nw = narrow(w), lw = 40, rt = nw ? 40 : 90, cw = (w - lw - rt) / 12, ch = nw ? 20 : 24, m = { t: 20 }, H = m.t + ch * Y.length + 4;
      const svg = svgIn(el, w, H), g = svg.append('g').attr('transform', `translate(${lw},${m.t})`);
      const mx = d3.max(c.grid, x => x[2]), col = d3.scaleSequentialSqrt(seqRamp()).domain([0, mx]);
      MON[LANG].forEach((mn, j) => g.append('text').attr('class', 'lbl mut').attr('x', j * cw + cw / 2).attr('y', -7).attr('text-anchor', 'middle').text(nw ? mn.slice(0, 1) : mn));
      const yt = Y.map(y => sum(d3.range(1, 13), m => G.get(y + ':' + m) || 0)), xb = d3.scaleLinear().domain([0, d3.max(yt)]).range([0, rt - (nw ? 4 : 44)]);
      Y.forEach((y, i) => {
        g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', i * ch + ch / 2 + 4).attr('text-anchor', 'end').text(y);
        d3.range(1, 13).forEach(m => { const v = G.get(y + ':' + m) || 0;
          bindTip(g.append('rect').attr('x', (m - 1) * cw + 1).attr('y', i * ch + 1).attr('width', cw - 2).attr('height', ch - 2).attr('rx', 3).attr('fill', v ? col(v) : css('--surface-2')).datum({ y, m, v }),
            d => `<b>${L(MNOM[d.m - 1], MEN[d.m - 1])} ${d.y}</b>` + trow(null, L('Αποφάσεις', 'Decisions'), fmt(d.v)) + trow(null, L('Του έτους', 'Of the year'), pct(d.v, yt[i]))); });
        const xe = 12 * cw + 8;
        if (!nw) g.append('path').attr('d', barPath(xe, i * ch + ch / 2 - 5, xe + xb(yt[i]), 10, 2)).attr('fill', css('--s1'));
        g.append('text').attr('class', 'lbl').attr('x', xe + (nw ? 0 : xb(yt[i]) + 6)).attr('y', i * ch + ch / 2 + 4).text(kfmt(yt[i]));
      });
      note(el, ['git log (In-force: η ημέρα δημοσίευσης)'], L(`${fmt(N)} αποφάσεις`, `${fmt(N)} decisions`),
        L('η ημέρα είναι εκείνη που η απόφαση δημοσιεύθηκε σε δημόσια συνεδρίαση, όπως τη γράφει το κείμενό της. Από τις ποινικές του 2008 και του 2009 λείπουν σχεδόν όλες.', 'the day is the one on which the decision was published in open court, as its text gives it. Nearly all criminal decisions of 2008 and 2009 are missing.'));
      table(el, [t('year'), ...MON[LANG], t('total')], Y.map((y, i) => [String(y), ...d3.range(1, 13).map(m => G.get(y + ':' + m) || 0), yt[i]]));
    }

chart('c16', el => {
  const c = D.c16, rows = c.rows, A = c.all, N = sum(OUTK, k => A[k] || 0);
  const sh = r => r.quash / r.n, main = rows.filter(r => !r.sec.startsWith('Ολ')), lo = main.reduce((a, b) => sh(b) < sh(a) ? b : a), hi = main.reduce((a, b) => sh(b) > sh(a) ? b : a);

    toc: L('Αναιρεί ή απορρίπτει', 'Quash or dismiss'),

      `What each section decides, as the operative part of the decision («ΓΙΑ ΤΟΥΣ ΛΟΓΟΥΣ ΑΥΤΟΥΣ») says: it quashes the judgment appealed against, dismisses the appeal, declares it inadmissible or closes the case, or something else (refers, adjourns, corrects). Overall it quashes in ${fmt(A.quash)} decisions and dismisses in ${fmt(A.dismiss)}.`),

      bands(el, rows, OUTK, colors, names, { rowH: 30, l: lw, ln: lw, r: 70, rn: 54, minIn: 34, label: r => L(...SECN[r.sec]), right: r => fmt(r.n), labelFill: r => r.sec.startsWith('Ολ') ? css('--text-2') : null });
      note(el, ['caselaw/areios-pagos/…/decision.html (ΓΙΑ ΤΟΥΣ ΛΟΓΟΥΣ ΑΥΤΟΥΣ)'], L(`${fmt(N)} αποφάσεις`, `${fmt(N)} decisions`),
        L(`το αποτέλεσμα είναι το πρώτο ρήμα του διατακτικού (κανόνες στο src/prep.py): «Αναιρεί» και «Αναιρεί εν μέρει» μετρούν ως αναίρεση, ακόμη κι αν ακολουθεί απόρριψη άλλης αίτησης. ${fmt(c.no_op)} αποφάσεις χωρίς αναγνώσιμο διατακτικό δεν μετρούν· λείπουν και οι ποινικές του 2008–2009. Τα τμήματα διακοπών και οι παλαιότερες εγγραφές χωρίς τμήμα δεν εμφανίζονται χωριστά.`,

          .attr('fill', ink).attr('fill-opacity', .62).attr('stroke', css('--surface')).attr('stroke-width', 1),
          p => `<b>${esc(seatName(p.k))}</b>` + trow(grpCol('civil'), L('Πολιτικές', 'Civil'), fmt(C[p.k].civil || 0)) + trow(grpCol('criminal'), L('Ποινικές', 'Criminal'), fmt(C[p.k].criminal || 0)) +
            trow(null, L('Ολομέλεια', 'Plenary'), fmt(C[p.k].plenary || 0)) + trow(null, L('Από εφετείο / πρώτο βαθμό', 'From appeal / first instance'), `${fmt(C[p.k].lv_appeal || 0)} / ${fmt(C[p.k].lv_first || 0)}`) +
            trow(null, L('Αναιρεί', 'Quashes'), pct((C[p.k].q_civil || 0) + (C[p.k].q_criminal || 0) + (C[p.k].q_plenary || 0), (C[p.k].o_civil || 0) + (C[p.k].o_criminal || 0) + (C[p.k].o_plenary || 0))));
        // labels for the largest, placed where they do not collide
        const placed = [], lab = svg.append('g');
        pts.slice(0, narrow(w) ? 5 : 9).forEach(p => {
          const txt = seatName(p.k), tw = textW(pm, [txt], 'lbl strong'), rr = Math.max(2, r(p.n));
          for (const [dx, dy, an] of [[rr + 4, 4, 'start'], [-rr - 4, 4, 'end'], [0, -rr - 5, 'middle'], [0, rr + 13, 'middle']]) {
            const x0 = an === 'start' ? p.x + dx : an === 'end' ? p.x + dx - tw : p.x - tw / 2, b = [x0 - 2, p.y + dy - 11, x0 + tw + 2, p.y + dy + 3];
            if (b[0] < 0 || b[2] > w || b[1] < 0 || b[3] > h) continue;
            if (placed.some(q => !(b[2] < q[0] || b[0] > q[2] || b[3] < q[1] || b[1] > q[3]))) continue;
            if (pts.some(o => o !== p && Math.hypot(o.x - (b[0] + b[2]) / 2, o.y - (b[1] + b[3]) / 2) < Math.max(2, r(o.n)) * 0.6)) continue;
            placed.push(b); halo(lab, p.x + dx, p.y + dy, txt, an, 'lbl strong'); break;
          }
        });
      };
      const fail = () => pm.append('p').attr('class', 'note').text(L('Ο χάρτης δεν φορτώθηκε (cdn.jsdelivr.net)· οι αριθμοί είναι δεξιά και στον πίνακα.', 'The map could not be loaded (cdn.jsdelivr.net); the numbers are on the right and in the table.'));
      if (WORLD50) draw(); else worldAtlas50().then(draw).catch(fail);
      pb.append('h4').text(L('Οι πόλεις με τις περισσότερες υποθέσεις', 'The cities with the most cases'));
      const top = keys.slice(0, 14).map(k => ({ k, civil: C[k].civil || 0, criminal: C[k].criminal || 0, plenary: C[k].plenary || 0 }));
      legend(pb, [{ c: grpCol('civil'), l: L('Πολιτικές', 'Civil') }, { c: grpCol('criminal'), l: L('Ποινικές', 'Criminal') }, { c: grpCol('plenary'), l: L('Ολομέλεια', 'Plenary') }]);
      const pw = W(pb), lw = Math.ceil(textW(pb, top.map(t_ => seatName(t_.k))) + 12), rowH = 20, s2 = svgIn(pb, pw, rowH * top.length + 4), g2 = s2.append('g').attr('transform', `translate(${lw},2)`);
      const vw = textW(pb, top.map(t_ => `${fmt(t_.civil + t_.criminal + t_.plenary)} · ${pct(t_.civil + t_.criminal + t_.plenary, N)}`), 'lbl') + 10;
      const xs = d3.scaleLinear().domain([0, tot(ath)]).range([0, Math.max(40, pw - lw - vw)]);
      top.forEach((t_, i) => {
        const cy = i * rowH; let acc = 0;
        g2.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + 14).attr('text-anchor', 'end').text(seatName(t_.k));
        const segs = ['civil', 'criminal', 'plenary'].filter(k => t_[k]);
        segs.forEach((k, q) => { const x0 = xs(acc), x1 = xs(acc + t_[k]); acc += t_[k];
          g2.append('path').attr('d', q === segs.length - 1 ? barPath(x0, cy + 4, Math.max(x0 + 1, x1), 12, 3) : `M${x0},${cy + 4}h${Math.max(0.5, x1 - x0 - 1)}v12h${-Math.max(0.5, x1 - x0 - 1)}Z`).attr('fill', grpCol(k)); });
        g2.append('text').attr('class', 'lbl').attr('x', xs(acc) + 6).attr('y', cy + 14).text(`${fmt(acc)} · ${pct(acc, N)}`);
        bindTip(g2.append('rect').attr('class', 'hit').attr('x', -lw).attr('width', pw).attr('y', cy).attr('height', rowH).datum(t_),
          d => `<b>${esc(seatName(d.k))}</b>` + ['civil', 'criminal', 'plenary'].map(k => trow(grpCol(k), L(...GRPN[k]), fmt(d[k]))).join('') + trow(null, t('total'), fmt(acc)));
      });
      note(el, ['caselaw/areios-pagos/…/decision.html'], L(`${fmt(N)} αποφάσεις με γνωστή έδρα`, `${fmt(N)} decisions with a known seat`),
        L(`η έδρα διαβάζεται από το όνομα του δικαστηρίου (π.χ. «Εφετείου Θεσσαλονίκης», «Τριμελούς Πλημμελειοδικείου Πειραιά»)· τα περιφερειακά εφετεία μετρούν στην πόλη όπου εδρεύουν (π.χ. το Εφετείο Θράκης στην Κομοτηνή, το Εφετείο Κρήτης στα Χανιά). Οι κύκλοι είναι ανάλογοι με τις αποφάσεις. ${fmt(c.texts - N)} αποφάσεις, χωρίς αναγνωρίσιμη έδρα, δεν μετρούν. Χάρτης: world-atlas (Natural Earth).`,
          `the seat is read from the court’s name (e.g. «Εφετείου Θεσσαλονίκης», «Τριμελούς Πλημμελειοδικείου Πειραιά»); regional courts of appeal count in the city where they sit (e.g. the Court of Appeal of Thrace in Komotini, of Crete in Chania). Circles are proportional to decisions. ${fmt(c.texts - N)} decisions without a recognisable seat are not counted. Map: world-atlas (Natural Earth).`));
      table(el, [L('Έδρα', 'Seat'), L('Πολιτικές', 'Civil'), L('Ποινικές', 'Criminal'), L('Ολομέλεια', 'Plenary'), t('total'), L('Αναιρεί', 'Quashes')],
        keys.map(k => [seatName(k), C[k].civil || 0, C[k].criminal || 0, C[k].plenary || 0, tot(k), pct((C[k].q_civil || 0) + (C[k].q_criminal || 0) + (C[k].q_plenary || 0), (C[k].o_civil || 0) + (C[k].o_criminal || 0) + (C[k].o_plenary || 0))]));
    }
  };
});

// reading order (chart numbers follow it)
const ORDER = ['p1', 'c01', 'c02', 'p2', 'c03', 'c04', 'c06', 'c05', 'p3', 'c07', 'c08', 'c09', 'c10', 'c11', 'c12', 'c13', 'c20', 'p4', 'c14', 'c15', 'c16', 'c17', 'c18', 'c19'];
CH.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));

// ------------------------------------------------------------------ page
function profileTable() {
  const P = PF, el = d3.select('#profile').html('');
  const rows = [
    [L('Σύνταγμα', 'Constitution'), 'syntagma/', `${fmt(P.articles)} ${L('άρθρα', 'articles')} · 5 ${L('εκδόσεις', 'versions')}`, L('το κείμενο του 2001 και οι αναθεωρήσεις του 2008 και του 2019, με τις επανεκδόσεις τους', 'the 2001 text and the 2008 and 2019 revisions, with their republications'), L('το κείμενο του 1975 και η αναθεώρηση του 1986 υπάρχουν μόνο ως εικόνες σελίδων και δεν περιέχονται', 'the 1975 text and the 1986 revision exist only as page images and are not included')],
    [L('Νόμοι', 'Laws'), 'nomos/<ΕΤΟΣ>/<ΑΡΙΘΜΟΣ>/', fmt(P.laws), L(`2006–2026· ${fmt(P.tracked)} από αυτούς με κάθε μεταγενέστερη τροποποίηση`, `2006–2026; ${fmt(P.tracked)} of them with every later amendment`), L('επιλογή: περίπου οι μισοί νόμοι κάθε έτους το 2006–2014, λιγότεροι μετά', 'a selection: about half of each year’s laws in 2006–2014, fewer after')],
    [L('Προεδρικά διατάγματα', 'Presidential decrees'), 'diatagma/<ΕΤΟΣ>/<ΑΡΙΘΜΟΣ>/', fmt(P.decrees), '2009–2026', L('επιλογή: 14–52 % των διαταγμάτων κάθε έτους', 'a selection: 14–52% of each year’s decrees')],
    [L('Διαύγεια', 'Diavgeia'), 'local/<ΦΟΡΕΑΣ>/ · norm/<ΦΟΡΕΑΣ>/', fmt(P.diavgeia), L(`${monthTxt(P.dv_from)} – ${monthTxt(P.dv_to)}· ${fmt(P.issuers)} φορείς`, `${monthTxt(P.dv_from)} – ${monthTxt(P.dv_to)}; ${fmt(P.issuers)} bodies`), L('μόνο τα στοιχεία κάθε ανάρτησης (το κείμενο δεν διαβάζεται)· κανονιστικές πράξεις, εγκύκλιοι, γνωμοδοτήσεις· το 2019 είναι ημιτελές', 'only each posting’s record (the text is not read); regulatory acts, circulars, opinions; 2019 is partial')],
    [L('Άρειος Πάγος', 'Areios Pagos'), 'caselaw/areios-pagos/', fmt(P.caselaw), `${P.ap_from.slice(0, 4)}–${P.ap_to.slice(0, 4)}`, L('οι αποφάσεις που δημοσιεύει ο ιστότοπος του δικαστηρίου· των ποινικών του 2008 και του 2009 λείπουν σχεδόν όλες', 'the decisions the court’s website publishes; nearly all criminal decisions of 2008 and 2009 are missing')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  const tr = s => Object.entries(PH).reduce((a, [x, y]) => a.split(x).join(LA(y)), s);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(tr(v))}</code>` : esc(v));
}
// a label that runs past the edge of its chart's card would be cut: report it (the charts size their columns to their labels)
function checkLeftLabels(fig) {
  const fr = fig.node().getBoundingClientRect();
  fig.selectAll('svg text').each(function () {
    const r = this.getBoundingClientRect();
    if (r.width && (r.left < fr.left - 0.5 || r.right > fr.right + 0.5)) console.warn('label outside its chart', fig.attr('id'), this.textContent);
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG;
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const tv = [[fmt(PF.diavgeia), L('πράξεις αναρτημένες στη Διαύγεια', 'acts posted on Diavgeia')], [fmt(PF.caselaw), L('αποφάσεις του Αρείου Πάγου', 'decisions of the Areios Pagos')],
    [fmt(PF.laws), L('νόμοι του ΦΕΚ', 'laws of the Gazette')], [fmt(PF.decrees), L('προεδρικά διατάγματα', 'presidential decrees')], [fmt(PF.articles), L('άρθρα του Συντάγματος', 'articles of the Constitution')],
    [fmt(PF.issuers), L('φορείς που αναρτούν στη Διαύγεια', 'bodies posting on Diavgeia')]];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html(d => `<b>${d[0]}</b><span>${d[1]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.el, c.en)); sec.append('p').attr('class', 'pd').text(L(c.del, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.el, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    checkLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.toc || spec.title.split(/:\s/)[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('gr-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('gr-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
// labels are measured as they are drawn: draw again when the web fonts have loaded, so the measures are the fonts' own
let ft;
const redraw = () => { clearTimeout(ft); ft = setTimeout(() => { const y = scrollY; render(); scrollTo(0, y); }, 120); };
const T0 = Date.now();
if (document.fonts) { if (document.fonts.status !== 'loaded') document.fonts.ready.then(redraw); document.fonts.addEventListener('loadingdone', () => { if (Date.now() - T0 < 15000) redraw(); }); }
</script>
