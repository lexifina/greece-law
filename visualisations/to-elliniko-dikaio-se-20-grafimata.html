  bindTip(g.selectAll('.hit').data(rows).join('rect').attr('class', 'hit').attr('x', r => x(r.y)).attr('width', x.bandwidth()).attr('y', 0).attr('height', ih),
    r => `<b>${opt.xf ? opt.xf(r.y) : r.y}${opt.partial && opt.partial(r) ? ' (' + (opt.partialTxt ? opt.partialTxt(r) : t('partial')) + ')' : ''}</b>` + keys.map((k, i) => (r[k] ? trow(colors[i], names[i], fmt(r[k]) + (opt.noShare ? '' : ` · ${pct(r[k], tot(r))}`)) : '')).reverse().join('') + trow(null, t('total'), fmt(tot(r))) + (opt.tipExtra ? opt.tipExtra(r) : ''));

// a label too wide for the plot, broken into two lines at the space nearest its middle (narrow screens)
function wrap2(el, s, room, cls = 'lbl strong') {
  if (textW(el, [s], cls) <= room) return [s];
  const sp = [...s.matchAll(/ /g)].map(m => m.index); if (!sp.length) return [s];
  const mid = s.length / 2, k = sp.reduce((a, b) => Math.abs(b - mid) < Math.abs(a - mid) ? b : a);
  return [s.slice(0, k), s.slice(k + 1)];
}

function barList(el, rows, o) {
  const w = W(el), nw = narrow(w), labs = rows.map(r => o.label(r, nw)), rw = o.rw || 44;
  const lw = nw ? 0 : Math.min(o.cap || 480, textW(el, labs) + 14);

  const svg = svgIn(el, w, 4 + tops[tops.length - 1]), g = svg.append('g').attr('transform', `translate(${lw},2)`);
  const x = d3.scaleLinear().domain([0, o.max || d3.max(rows, o.value) || 1]).range([0, Math.max(40, (o.barW ? o.barW(w - lw) : w - lw) - rw)]);
  rows.forEach((r, i) => {
    const cy = tops[i], v = o.value(r), by = nw ? cy + 13 * lines[i].length + 3 : cy + 5;
    if (nw) lines[i].forEach((ln, k) => g.append('text').attr('class', 'lbl strong').attr('x', 0).attr('y', cy + 11 + 13 * k).style('fill', o.labelFill ? o.labelFill(r) : null).text(ln));
    else g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + 15).attr('text-anchor', 'end').style('fill', o.labelFill ? o.labelFill(r) : null).text(labs[i]);
    if (v) g.append('path').attr('d', barPath(0, by, Math.max(2, x(v)), 12, 3)).attr('fill', o.color(r));
    g.append('text').attr('class', 'lbl').attr('x', (v ? Math.max(2, x(v)) + 6 : 0)).attr('y', by + 10).text(o.right ? o.right(r, nw) : fmt(v));

}

chart('c03', el => {

    draw(el) {

        topLabel: r => (r.omni + r.single >= 5 ? pct(r.omni, r.omni + r.single) : ''),
        tipExtra: r => (r.omni + r.single ? trow(null, L('«Και άλλες διατάξεις», στους νόμους που δεν κυρώνουν', '“And other provisions”, of laws ratifying nothing'), pct(r.omni, r.omni + r.single)) : '') +

        L(`το αποθετήριο περιέχει επιλογή νόμων: περίπου τους μισούς κάθε έτους το 2006–2014, λιγότερους μετά, κανέναν του 2017. Ο τίτλος διαβάζεται από την κεφαλίδα του κειμένου του νόμου ή από το data/laws.csv· η κατάληξη αναζητείται με τους κανόνες του src/prep.py. Το ποσοστό πάνω από μια στήλη είναι το μερίδιο των νόμων με «και άλλες διατάξεις» σε όσους δεν κυρώνουν κάτι, όταν είναι τουλάχιστον πέντε (στον πίνακα σε κάθε πλάτος οθόνης). Το 2026 είναι ημιτελές.`,

const PDT = { amend: ['Τροποποίηση άλλου διατάγματος ή νόμου', 'Amending another decree or law'], org: ['Οργάνωση υπηρεσιών: ίδρυση, σύσταση, κατάργηση', 'Organising services: founding, setting up, abolishing'],
  parish: ['Ενορίες, μονές και μητροπόλεις', 'Parishes, monasteries and metropolises'], staff: ['Θέσεις και προσωπικό', 'Posts and staff'], holiday: ['Τοπικές αργίες και εορτές', 'Local holidays and feast days'],
  univ: ['Πανεπιστήμια και σπουδές', 'Universities and studies'], municipal: ['Δήμοι, κοινότητες και νομοί', 'Municipalities, communities and prefectures'], eu: ['Ενσωμάτωση οδηγίας', 'Transposing a directive'], other: ['Άλλο', 'Other'] };
chart('c05', el => {
  const c = D.c05, T = c.topics, N = c.n, get = k => (T.find(r => r[0] === k) || [k, 0, {}]);
  const am = get('amend'), pa = get('parish'), ho = get('holiday'), strip = !narrow(W(el));
  return {
    title: L(`Τα προεδρικά διατάγματα: το ${pct(am[1], N)} τροποποιεί άλλο διάταγμα ή νόμο, το ${pct(pa[1], N)} αφορά ενορίες και μονές`, `Presidential decrees: ${pct(am[1], N)} amend another decree or law, ${pct(pa[1], N)} concern parishes and monasteries`),
    toc: L('Τα προεδρικά διατάγματα', 'Presidential decrees'),
    dek: L(`Τα ${fmt(N)} προεδρικά διατάγματα του αποθετηρίου (${c.years[0]}–${c.years[c.years.length - 1]}) ανά θέμα του τίτλου τους. Με διάταγμα ιδρύονται ενορίες και μονές (${fmt(pa[1])}) και καθιερώνονται τοπικές αργίες και εορτές, για τη μνήμη ενός αγίου ή για μια επέτειο (${fmt(ho[1])}).${strip ? ' Δεξιά, τα διατάγματα κάθε θέματος ανά έτος.' : ''}`,
      `The repository’s ${fmt(N)} presidential decrees (${c.years[0]}–${c.years[c.years.length - 1]}) by the subject of their title. Decrees found parishes and monasteries (${fmt(pa[1])}) and establish local holidays and feast days, for a saint’s memory or an anniversary (${fmt(ho[1])}).${strip ? ' On the right, each subject’s decrees by year.' : ''}`),
    draw(el) {
      const cols = S8(), rows = T.filter(r => r[0] !== 'other').concat(T.filter(r => r[0] === 'other'));
      const w = W(el), nw = narrow(w), YRS = c.years, cw = nw ? 0 : Math.min(20, Math.floor((w * 0.42) / YRS.length)), stripW = cw * YRS.length;
      const labs = rows.map(r => L(...PDT[r[0]])), lw = nw ? 0 : Math.ceil(textW(el, labs) + 14);
      const rowH = nw ? 36 : 24, m = { t: 22, b: 4 }, H = m.t + m.b + rowH * rows.length;
      const svg = svgIn(el, w, H), g = svg.append('g').attr('transform', `translate(${lw},${m.t})`);
      const vw = textW(el, rows.map(r => `${fmt(r[1])} · ${pct(r[1], N)}`), 'lbl') + 10;
      const barW = w - lw - (nw ? 0 : stripW + 26) - vw, x = d3.scaleLinear().domain([0, d3.max(rows, r => r[1])]).range([0, Math.max(60, barW)]);
      const hx = w - lw - stripW, mxc = d3.max(rows, r => d3.max(Object.values(r[2])) || 0), col = d3.scaleSequentialSqrt(seqRamp()).domain([0, mxc]);
      if (!nw) YRS.forEach((yy, j) => { if (j % 2 === 0 || j === YRS.length - 1) g.append('text').attr('class', 'lbl mut').attr('x', hx + j * cw + cw / 2).attr('y', -8).attr('text-anchor', 'middle').text(`’${String(yy).slice(2)}`); });
      rows.forEach((r, i) => {
        const cy = i * rowH, by = nw ? cy + 17 : cy + 6, fill = r[0] === 'other' ? css('--muted-mark') : r[0] === 'parish' || r[0] === 'holiday' ? cols[1] : cols[0];
        if (nw) g.append('text').attr('class', 'lbl strong').attr('x', 0).attr('y', cy + 12).text(labs[i]);
        else g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + 16).attr('text-anchor', 'end').text(labs[i]);
        g.append('path').attr('d', barPath(0, by, Math.max(2, x(r[1])), 13, 3)).attr('fill', fill);
        g.append('text').attr('class', 'lbl').attr('x', x(r[1]) + 6).attr('y', by + 11).text(`${fmt(r[1])} · ${pct(r[1], N)}`);
        if (!nw) YRS.forEach((yy, j) => { const v = r[2][yy] || 0;
          g.append('rect').attr('x', hx + j * cw + 1).attr('y', cy + 3).attr('width', cw - 2).attr('height', rowH - 6).attr('rx', 3).attr('fill', v ? col(v) : css('--surface-2')); });
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -lw).attr('width', w).attr('y', cy).attr('height', rowH).datum(r),
          d => `<b>${esc(L(...PDT[d[0]]))}</b>` + trow(null, L('Διατάγματα', 'Decrees'), `${fmt(d[1])} · ${pct(d[1], N)}`) + YRS.filter(yy => d[2][yy]).map(yy => trow(null, yy, fmt(d[2][yy]))).join('') +
            (c.examples[d[0]] ? `<div class="q">${esc(c.examples[d[0]][0])}</div>` : ''));
      });
      note(el, ['diatagma/<ΕΤΟΣ>/<ΑΡΙΘΜΟΣ>/', 'data/acts.json'], L(`${fmt(N)} διατάγματα`, `${fmt(N)} decrees`),
        L(`το θέμα διαβάζεται από λέξεις του τίτλου με τους κανόνες του src/prep.py, με τη σειρά του γραφήματος· ό,τι δεν αναγνωρίζεται είναι «Άλλο». Το αποθετήριο περιέχει επιλογή διαταγμάτων, από 14 % έως 52 % των διαταγμάτων κάθε έτους (κατά την αρίθμησή τους), οπότε τα ποσοστά αφορούν αυτή την επιλογή.`,
          `the subject is read from words in the title by the rules in src/prep.py, in the chart’s order; anything not recognised is “Other”. The repository holds a selection of decrees, 14% to 52% of each year’s decrees (by their numbering), so the shares are of that selection.`));
      table(el, [L('Θέμα', 'Subject'), ...YRS.map(String), t('total')], rows.map(r => [L(...PDT[r[0]]), ...YRS.map(yy => r[2][yy] || 0), r[1]]));
    }
  };
});

// ================================================================== III. Diavgeia
const MACC = ['Ιανουάριο', 'Φεβρουάριο', 'Μάρτιο', 'Απρίλιο', 'Μάιο', 'Ιούνιο', 'Ιούλιο', 'Αύγουστο', 'Σεπτέμβριο', 'Οκτώβριο', 'Νοέμβριο', 'Δεκέμβριο'];
const fromTo = (a, b) => { const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number);
  return L(`από τον ${MACC[ma - 1]} του ${ya} ως τον ${MACC[mb - 1]} του ${yb}`, `from ${MEN[ma - 1]} ${ya} to ${MEN[mb - 1]} ${yb}`); };
const CATS = ['dimos', 'perif', 'apok', 'ypourg', 'univ', 'other'];
const CATN = { dimos: ['Δήμοι', 'Municipalities'], perif: ['Περιφέρειες', 'Regions'], apok: ['Αποκεντρωμένες διοικήσεις', 'Decentralised administrations'], ypourg: ['Υπουργεία', 'Ministries'],
  univ: ['Πανεπιστήμια και ΤΕΙ', 'Universities and TEIs'], other: ['Άλλοι φορείς', 'Other bodies'], all: ['Όλοι οι φορείς', 'All bodies'] };
const catCol = k => ({ dimos: css('--s1'), perif: css('--s3'), apok: css('--s4'), ypourg: css('--s7'), univ: css('--s5'), other: css('--muted-mark') }[k]);
const kfmt = v => v >= 10000 ? L(`${fmt(Math.round(v / 1000))} χιλ.`, `${fmt(Math.round(v / 1000))}k`) : fmt(v);
const dvPartial = y => y === PF.dv_from.slice(0, 4) || y === PF.dv_to.slice(0, 4);
const dvPartTxt = y => y === PF.dv_from.slice(0, 4) ? L(`από τον ${MACC[+PF.dv_from.slice(5) - 1]}`, `from ${MEN[+PF.dv_from.slice(5) - 1]}`) : L(`ως τον ${MACC[+PF.dv_to.slice(5) - 1]}`, `to ${MEN[+PF.dv_to.slice(5) - 1]}`);

part('p3', 'III. Διαύγεια: οι πράξεις της διοίκησης', 'III. Diavgeia: the acts of the administration',
  'Στη Διαύγεια οι δημόσιοι φορείς αναρτούν τις πράξεις τους, και το αποθετήριο χρονολογεί κάθε πράξη από την ανάρτησή της (ν. 3861/2010 άρθρο 2 παρ. 4· ν. 4727/2020 άρθρο 78 παρ. 2). Περιέχει τις κανονιστικές πράξεις, τις εγκυκλίους και τις γνωμοδοτήσεις που ανάρτησαν δήμοι, περιφέρειες, αποκεντρωμένες διοικήσεις, υπουργεία, πανεπιστήμια και άλλοι φορείς (local/, norm/), μία ανά commit· τα γραφήματα διαβάζουν μόνο τα στοιχεία της ανάρτησης, όχι το κείμενο.',
  'On Diavgeia public bodies post their acts, and the repository dates each act from its posting (ν. 3861/2010 art. 2 par. 4; ν. 4727/2020 art. 78 par. 2). It holds the regulatory acts, circulars and opinions posted by municipalities, regions, decentralised administrations, ministries, universities and other bodies (local/, norm/), one per commit; the charts read only each posting’s record, not the text.');

chart('c07', el => {
  const c = D.c07, R = c.years, N = c.n, tot = k => sum(R, r => r[k]), ty = new Map(c.types);

      `Each column is the acts posted in one year, by kind of body. In each full year ${fmt(d3.min(iss))} to ${fmt(d3.max(iss))} bodies posted. ${pct(ty.get('Α.2 ΚΑΝΟΝΙΣΤΙΚΗ ΠΡΑΞΗ'), N)} were posted as a “regulatory act”; the rest are ${fmt(ty.get('Α.3 ΕΓΚΥΚΛΙΟΣ'))} circulars, ${fmt(ty.get('Α.4 ΓΝΩΜΟΔΟΤΗΣΗ'))} opinions and ${fmt(ty.get('Α.5 ΠΡΑΚΤΙΚΑ (Νομικού Συμβουλίου του Κράτους)') || 0)} minutes of the Legal Council of the State.`),

        L(`το έτος είναι εκείνο της ανάρτησης· το είδος του φορέα διαβάζεται από το όνομά του (κανόνες στο src/prep.py). Τα έτη ${PF.dv_from.slice(0, 4)} και ${PF.dv_to.slice(0, 4)} είναι ημιτελή (πιο ανοιχτό χρώμα). Τα είδη πράξεων που περιέχει το αποθετήριο είναι μόνο αυτά τα τέσσερα· οι άλλες πράξεις της Διαύγειας (αναθέσεις, πληρωμές, διορισμοί κ.λπ.) δεν περιέχονται.`,
          `the year is that of the posting; the kind of body is read from its name (rules in src/prep.py). ${PF.dv_from.slice(0, 4)} and ${PF.dv_to.slice(0, 4)} are partial (lighter). These four kinds of act are the only ones the repository holds; Diavgeia’s other acts (awards, payments, appointments and so on) are not included.`));
      table(el, [t('year'), ...names, t('total'), L('Φορείς', 'Bodies')], R.map(r => [r.y, ...CATS.map(k => r[k]), sum(CATS, k => r[k]), r.issuers]));
    }
  };
});

const TOPN = { procurement: ['Προμήθειες, έργα, μελέτες, συμβάσεις', 'Procurement, works, studies, contracts'], committee: ['Επιτροπές και ορισμοί μελών', 'Committees and appointments of members'],
  budget: ['Πιστώσεις, δαπάνες, προϋπολογισμός', 'Credits, spending, budget'], staff: ['Προσωπικό', 'Staff'], legality: ['Έλεγχος νομιμότητας', 'Legality review'],
  property: ['Ακίνητα, μισθώσεις, παραχωρήσεις', 'Property, leases, concessions'], permits: ['Άδειες και βεβαιώσεις', 'Permits and certificates'], forest: ['Δάση, αλιεία, θήρα, περιβάλλον', 'Forests, fishing, hunting, environment'],

  grants: ['Επιχορηγήσεις και ενισχύσεις', 'Grants and aid'], regulation: ['Κανονισμοί', 'Regulations'], other: ['Άλλο', 'Other'] };
chart('c08', el => {
  const c = D.c08, N = c.n, T = new Map(c.topics);
  return {
    title: L(`Τι λένε οι τίτλοι: το ${pct(T.get('procurement'), N)} των πράξεων αφορά προμήθειες, έργα και συμβάσεις, μόνο το ${pct(c.reg_any, N, 1)} κάποιον κανονισμό`, `What the titles say: ${pct(T.get('procurement'), N)} of the acts are about procurement, works and contracts, only ${pct(c.reg_any, N, 1)} about a regulation`),
    toc: L('Τι λένε οι τίτλοι', 'What the titles say'),
    dek: L(`Το είδος κάθε πράξης το επιλέγει ο φορέας που την αναρτά, και σχεδόν όλες αναρτήθηκαν ως «κανονιστική πράξη». Οι τίτλοι τους, όμως, μιλούν πρώτα για προμήθειες και έργα, επιτροπές, πιστώσεις, προσωπικό και ελέγχους νομιμότητας· μόνο ${fmt(c.reg_any)} τίτλοι έχουν τη λέξη «κανονισμός». Κάθε μπάρα χωρίζεται ανά είδος φορέα.`,
      `The kind of each act is chosen by the body that posts it, and nearly all were posted as a “regulatory act”. Their titles, though, speak first of procurement and works, committees, credits, staff and legality reviews; only ${fmt(c.reg_any)} titles have the word “regulation” (κανονισμός). Each bar is split by kind of body.`),
    draw(el) {
      const keys = CATS, colors = keys.map(catCol), names = keys.map(k => L(...CATN[k]));
      legend(el, keys.map((k, i) => ({ c: colors[i], l: names[i] })));
      const order = c.topics.map(r => r[0]).filter(k => k !== 'other').concat(['other']);
      const rows = order.map(k => ({ k, ...c.by_cat && Object.fromEntries(CATS.map(cc => [cc, c.by_cat[cc][k] || 0])) }));
      const w = W(el), nw = narrow(w), labs = rows.map(r => L(...TOPN[r.k])), lw = nw ? 0 : Math.ceil(textW(el, labs) + 14), rowH = nw ? 34 : 24;
      const svg = svgIn(el, w, rowH * rows.length + 6), g = svg.append('g').attr('transform', `translate(${lw},2)`);
      const tot = r => sum(keys, k => r[k]), x = d3.scaleLinear().domain([0, d3.max(rows, tot)]).range([0, w - lw - 96]);
      rows.forEach((r, i) => {
        const cy = i * rowH, by = nw ? cy + 17 : cy + 6, bh = 13;
        if (nw) g.append('text').attr('class', 'lbl strong').attr('x', 0).attr('y', cy + 12).text(labs[i]);
        else g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + 16).attr('text-anchor', 'end').style('fill', r.k === 'regulation' ? css('--text') : null).style('font-weight', r.k === 'regulation' ? 600 : null).text(labs[i]);
        let acc = 0; const segs = keys.map((k, j) => ({ j, v: r[k] })).filter(s => s.v);
        segs.forEach((s, q) => { const x0 = x(acc), x1 = x(acc + s.v); acc += s.v; const last = q === segs.length - 1;
          g.append('path').attr('d', last ? barPath(x0, by, Math.max(x0 + 1, x1), bh, 3) : `M${x0},${by}h${Math.max(0.5, x1 - x0 - 1)}v${bh}h${-Math.max(0.5, x1 - x0 - 1)}Z`).attr('fill', r.k === 'other' ? css('--muted-mark') : colors[s.j]).attr('opacity', r.k === 'other' ? .8 : 1); });
        g.append('text').attr('class', 'lbl').attr('x', x(tot(r)) + 6).attr('y', by + 11).text(`${pct(tot(r), N, tot(r) / N < .01 ? 1 : 0)} · ${kfmt(tot(r))}`);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -lw).attr('width', w).attr('y', cy).attr('height', rowH).datum(r),
          d => `<b>${esc(L(...TOPN[d.k]))}</b>` + keys.map((k, j) => d[k] ? trow(colors[j], names[j], `${fmt(d[k])} · ${pct(d[k], tot(d))}`) : '').join('') + trow(null, t('total'), `${fmt(tot(d))} · ${pct(tot(d), N, 1)}`));
      });
      note(el, ['git log (Kind: decision-record, Decision-type, θέμα)'], L(`${fmt(N)} τίτλοι`, `${fmt(N)} titles`),
        L(`το θέμα διαβάζεται από λέξεις του τίτλου, με τους κανόνες του src/prep.py και με τη σειρά τους: ένας τίτλος μετρά στην πρώτη ομάδα που ταιριάζει (ένας έλεγχος νομιμότητας μιας απόφασης για προμήθεια μετρά ως έλεγχος νομιμότητας). Ό,τι δεν αναγνωρίζεται είναι «Άλλο».`,
          `the subject is read from words in the title, by the rules in src/prep.py and in their order: a title counts in the first group it matches (a legality review of a procurement decision counts as a legality review). Anything not recognised is “Other”.`));

    }

  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const tv = [[fmt(PF.diavgeia), L('πράξεις αναρτημένες στη Διαύγεια', 'acts posted on Diavgeia')], [fmt(PF.caselaw), L('αποφάσεις του Αρείου Πάγου', 'decisions of the Areios Pagos')],
    [fmt(PF.laws), L('νόμοι του ΦΕΚ', 'laws of the Gazette')], [fmt(PF.decrees), L('προεδρικά διατάγματα', 'presidential decrees')], [fmt(PF.articles), L('άρθρα του Συντάγματος', 'articles of the Constitution')],
    [fmt(PF.issuers), L('φορείς που αναρτούν στη Διαύγεια', 'bodies posting on Diavgeia')]];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html(d => `<b>${d[0]}</b><span>${d[1]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.el, c.en)); sec.append('p').attr('class', 'pd').text(L(c.del, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.el, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    checkLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.toc || spec.title.split(/:\s/)[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('gr-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('gr-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
// labels are measured as they are drawn: draw again when the web fonts have loaded, so the measures are the fonts' own
let ft;
const redraw = () => { clearTimeout(ft); ft = setTimeout(() => { const y = scrollY; render(); scrollTo(0, y); }, 120); };
const T0 = Date.now();
if (document.fonts) { if (document.fonts.status !== 'loaded') document.fonts.ready.then(redraw); document.fonts.addEventListener('loadingdone', () => { if (Date.now() - T0 < 15000) redraw(); }); }
</script>
</body>
